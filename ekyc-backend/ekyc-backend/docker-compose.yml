 services:
  postgres:
    image: postgres:16-alpine
    container_name: ekyc-postgres
    environment:
      POSTGRES_DB: ekyc
      POSTGRES_USER: ekyc
      POSTGRES_PASSWORD: ekyc
    ports:
      # 5433 côté machine pour ne pas entrer en conflit avec un PostgreSQL local déjà installé sur 5432
      - "5433:5432"
    volumes:
      - ekyc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekyc -d ekyc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ekyc_pgdata:
